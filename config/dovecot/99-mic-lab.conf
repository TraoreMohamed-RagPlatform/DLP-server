# /etc/dovecot/conf.d/99-mic-lab.conf
# Configuration Dovecot 2.3 du labo mic.lab (AlmaLinux 9)
# Dovecot lit conf.d/ par ordre alphabétique : ce fichier "99-" passe en dernier
# et remplace les valeurs par défaut, sans modifier les fichiers d'origine.

# IMAP uniquement (lecture des mails)
protocols = imap

# Même dossier que Postfix (home_mailbox = Maildir/)
mail_location = maildir:~/Maildir

# Mot de passe accepté seulement dans un tunnel chiffré
disable_plaintext_auth = yes
auth_mechanisms = plain login

# Chiffrement obligatoire, même certificat que Postfix
ssl = required
ssl_cert = </etc/pki/tls/certs/mail.mic.lab.crt
ssl_key = </etc/pki/tls/private/mail.mic.lab.key

# Guichet SASL : Postfix demande à Dovecot de vérifier les mots de passe
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
